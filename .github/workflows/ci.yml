name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    name: Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -q && sudo apt-get install -y cmake ninja-build g++-12
      - name: Configure
        run: CXX=g++-12 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
  asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -q && sudo apt-get install -y cmake ninja-build g++-12
      - name: Configure
        run: CXX=g++-12 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
      - name: Build & Test
        run: cmake --build build --parallel $(nproc) && ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y cmake ninja-build g++-12
      - run: CXX=g++-12 cmake -S . -B build -G Ninja -DFIX_SANITIZERS=ON
      - run: cmake --build build --parallel $(nproc)
      - run: ctest --test-dir build --output-on-failure --timeout 60
  fuzz-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y cmake ninja-build clang
      - run: CXX=clang++ cmake -S . -B build -G Ninja -DFIX_FUZZ=ON
      - run: cmake --build build --target fuzz_parser
      - run: ./build/fuzz_parser fuzz/corpus -max_len=4096 -max_total_time=120 -timeout=5
